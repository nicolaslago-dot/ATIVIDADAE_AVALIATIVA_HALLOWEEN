<!--
ATIVIDADE INDIVIDUAL — Sibele

OBJETIVO
Criar sua própria página de uma mídia de terror ou horror usando HTML e CSS.
Esta tarefa é individual e deve ser feita além do trabalho da sua equipe.

ANTES DE COMEÇAR
Sua pasta já existe. Não a renomeie e não crie outra pasta com seu nome.
Este arquivo contém somente um enunciado em comentário: é normal que fique
vazio no navegador enquanto você não escrever o HTML da página.

O QUE FAZER
1. Escolha um filme, uma série, um jogo ou um livro de terror ou horror.
2. Depois do fechamento deste comentário, crie a estrutura HTML. No Visual
   Studio Code, você pode usar ! e Enter em uma linha vazia fora do comentário.
3. Confira idioma, codificação, configuração para celular e título da aba.
4. Apresente seu nome, o título e o tipo da mídia escolhida.
5. Escreva uma descrição com suas palavras, conte a história ou apresente
   características principais e explique por que escolheu essa mídia.
6. Crie uma pasta imagens aqui e guarde uma imagem relacionada ao conteúdo.
   Inclua essa imagem no HTML com um texto alternativo adequado.
7. Conecte style.css ao HTML por meio de um link de folha de estilos no head.
8. Escreva seu próprio CSS fora do comentário de style.css. O arquivo contém
   apenas orientações: não há regras prontas. Não copie o CSS de um colega.
9. Inclua um link para voltar ao catálogo da turma.

CAMINHOS A PARTIR DESTE HTML
- Seu CSS: style.css
- Imagem na sua pasta: imagens/NOME-REAL-DO-ARQUIVO
- Retorno ao catálogo da turma: ../../categorias.html
- Base comum, se desejar usar também: ../../css/global.css
Cada ../ volta uma pasta. Mesmo usando a base comum, escreva seu style.css.

COMO CONFERIR
Salve os arquivos e atualize o navegador. Confira texto, imagem e estilos.
Abra seu nome em categorias.html e teste o link de retorno da sua página.
Teste também em uma janela estreita e percorra os links usando Tab.
A página estará pronta quando tiver conteúdo próprio, seu nome, imagem,
CSS escrito por você e navegação funcionando em computador e celular.

Consulte README.md e EQUIPES.md na pasta principal para mais orientações.
-->
